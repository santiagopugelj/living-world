<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living World</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <button id="inventoryButton" type="button" aria-expanded="false" aria-controls="inventoryPanel">Inventory</button>
    </div>
    <canvas id="worldCanvas"></canvas>
    <section id="inventoryPanel" aria-labelledby="inventoryTitle" hidden>
      <h2 id="inventoryTitle">Inventory</h2>
      <div id="inventoryWood">Wood: 0</div>
      <div id="inventoryStone">Stone: 0</div>
      <div id="inventoryFood">Food: 0</div>
      <div id="inventoryAxe" hidden>Tool: Basic Axe</div>
    </section>
    <div id="dialogueBox" role="dialog" aria-labelledby="dialogueName" hidden>
      <strong id="dialogueName"></strong>
      <p id="dialogueText"></p>
      <button id="closeDialogueButton" type="button">Close</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
